<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-label="Kawałek sernika z malinami i listkiem mięty na talerzyku">
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF1C6"/><stop offset="1" stop-color="#F5DA96"/></linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3D78F"/><stop offset="1" stop-color="#E5BE6C"/></linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9773B"/><stop offset="1" stop-color="#8A4B22"/></linearGradient>
    <linearGradient id="baseSide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9C5F2C"/><stop offset="1" stop-color="#733C17"/></linearGradient>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
    <g id="rasp">
      <circle r="14" fill="#A81F38"/>
      <g fill="#D8465D"><circle cx="-5.5" cy="-5.5" r="5"/><circle cx="5.5" cy="-4.5" r="5"/><circle cx="-6.5" cy="5.5" r="5"/><circle cx="5.5" cy="6.5" r="5"/><circle cx="0" cy="0" r="5"/></g>
      <ellipse cx="-4" cy="-9" rx="4.5" ry="2.2" fill="#fff" opacity=".4"/>
    </g>
  </defs>
  <path d="M40 88C80 30 220 10 340 30c80 14 118 60 106 130-12 70-96 130-216 138C130 304 46 250 34 170 30 140 32 110 40 88Z" fill="#F7E6BA"/>

  <!-- talerzyk -->
  <ellipse cx="240" cy="284" rx="206" ry="30" fill="#2B1D14" opacity=".2" filter="url(#sh2)"/>
  <ellipse cx="240" cy="270" rx="206" ry="44" fill="#E7DCC8"/>
  <ellipse cx="240" cy="264" rx="206" ry="44" fill="#FFFDF8"/>
  <ellipse cx="240" cy="266" rx="160" ry="30" fill="#F3EBDD"/>

  <!-- cień kawałka -->
  <ellipse cx="262" cy="272" rx="140" ry="16" fill="#2B1D14" opacity=".18" filter="url(#sh2)"/>

  <!-- kawałek sernika: front -->
  <path d="M136 196H320V268C320 274 314 278 306 278H150C142 278 136 274 136 268Z" fill="url(#front)"/>
  <path d="M136 244H320V268C320 274 314 278 306 278H150C142 278 136 274 136 268Z" fill="url(#base)"/>
  <!-- bok -->
  <path d="M320 196 392 164V236L320 278Z" fill="url(#side)"/>
  <path d="M320 244 392 210V236L320 278Z" fill="url(#baseSide)"/>
  <!-- wierzch -->
  <path d="M136 196 208 164H392L320 196Z" fill="#FFF8DE"/>
  <path d="M136 196 208 164H392L320 196Z" fill="none" stroke="#FFFCEB" stroke-width="3" stroke-linejoin="round"/>
  <path d="M158 190 214 168" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".7"/>
  <!-- delikatne warstwy -->
  <g stroke="#E7C978" stroke-width="2" stroke-linecap="round" opacity=".7"><path d="M150 214H306"/><path d="M150 230H306"/></g>

  <!-- maliny i mięta -->
  <use href="#rasp" x="262" y="172"/>
  <use href="#rasp" x="288" y="180"/>
  <use href="#rasp" x="240" y="180"/>
  <g fill="#3F6B4B">
    <ellipse cx="322" cy="168" rx="19" ry="9" transform="rotate(-30 322 168)"/>
    <ellipse cx="336" cy="182" rx="17" ry="8" transform="rotate(14 336 182)"/>
  </g>
  <path d="M296 176C308 172 320 168 332 164" stroke="#2F5239" stroke-width="2" fill="none"/>
</svg>
