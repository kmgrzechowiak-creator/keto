    <ellipse cx="238" cy="352" rx="3" ry="1.8"/><ellipse cx="318" cy="356" rx="3.4" ry="2"/><ellipse cx="180" cy="356" rx="3" ry="1.8"/>
  </g>

  <!-- kromki -->
  <g transform="translate(420 246) rotate(6)">
    <use href="#slice" fill="#9C5A25"/>
    <use href="#slice" fill="url(#crumb)" transform="translate(9 9) scale(.84)"/>
    <g fill="#E3C687">
