  <g fill="#E0AE45">
    <ellipse cx="74" cy="194" rx="5.5" ry="11"/>
    <ellipse cx="65" cy="208" rx="5" ry="10" transform="rotate(-24 65 208)"/><ellipse cx="83" cy="208" rx="5" ry="10" transform="rotate(24 83 208)"/>
    <ellipse cx="63" cy="226" rx="5" ry="10" transform="rotate(-24 63 226)"/><ellipse cx="81" cy="226" rx="5" ry="10" transform="rotate(24 81 226)"/>
    <ellipse cx="122" cy="234" rx="5.5" ry="11" transform="rotate(20 122 234)"/>
    <ellipse cx="111" cy="248" rx="5" ry="10" transform="rotate(-4 111 248)"/><ellipse cx="130" cy="252" rx="5" ry="10" transform="rotate(44 130 252)"/>
    <ellipse cx="106" cy="268" rx="5" ry="10" transform="rotate(-4 106 268)"/><ellipse cx="124" cy="272" rx="5" ry="10" transform="rotate(44 124 272)"/>
