<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Kuchenny stół z bochenkiem chleba, wałkiem i kubkiem herbaty przy oknie">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7E6BA"/><stop offset="1" stop-color="#F3D99A"/></linearGradient>
    <linearGradient id="tbl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C99862"/><stop offset="1" stop-color="#A67444"/></linearGradient>
    <linearGradient id="loaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D89A52"/><stop offset="1" stop-color="#8A4B22"/></linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF3C4"/><stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="640" height="480" rx="28" fill="url(#wall)"/>
  <!-- okno -->
  <g>
    <circle cx="180" cy="170" r="170" fill="url(#sun)"/>
    <rect x="96" y="48" width="170" height="190" rx="10" fill="#FFFDF0" stroke="#8A4B22" stroke-width="10"/>
    <path d="M181 48V238M96 143H266" stroke="#8A4B22" stroke-width="8"/>
    <path d="M106 60H172V134H106Z" fill="#DDEBD8" opacity=".7"/><path d="M190 60H256V134H190Z" fill="#DDEBD8" opacity=".7"/>
    <g fill="#3F6B4B"><ellipse cx="128" cy="126" rx="20" ry="9" transform="rotate(-20 128 126)"/><ellipse cx="150" cy="118" rx="18" ry="8" transform="rotate(25 150 118)"/></g>
  </g>
  <!-- półka -->
  <rect x="330" y="86" width="240" height="10" rx="5" fill="#A67444"/>
  <g>
    <rect x="352" y="42" width="46" height="44" rx="8" fill="#FFFDF8" stroke="#E5D6BB" stroke-width="3"/>
    <rect x="404" y="52" width="40" height="34" rx="8" fill="#3F6B4B"/>
    <rect x="452" y="38" width="52" height="48" rx="8" fill="#E9B949"/>
    <path d="M362 58H388M362 68H380" stroke="#C9B48A" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- stół -->
  <rect x="0" y="330" width="640" height="150" rx="0" fill="url(#tbl)"/>
  <path d="M0 330H640" stroke="#8A5B2E" stroke-width="6"/>
  <g stroke="#B58553" stroke-width="2.5" fill="none" opacity=".7" stroke-linecap="round"><path d="M20 372C160 358 260 388 400 372S560 362 630 374"/><path d="M40 420C180 408 300 432 460 420"/></g>
  <!-- ściereczka -->
  <path d="M300 340 560 340 590 458 270 458Z" fill="#FFFDF8"/>
  <g stroke="#3F6B4B" stroke-width="4" opacity=".55"><path d="M296 366H566"/><path d="M290 396H574"/><path d="M280 426H584"/></g>
  <!-- bochenek -->
  <path d="M340 380C332 328 372 296 420 296 468 296 508 328 500 380 499 392 490 398 478 398H362C350 398 341 392 340 380Z" fill="url(#loaf)"/>
  <g fill="none" stroke-linecap="round"><path d="M384 322C398 332 404 350 406 372" stroke="#EDC486" stroke-width="9"/><path d="M426 316C440 326 444 346 444 370" stroke="#EDC486" stroke-width="9"/></g>
  <!-- wałek -->
  <g transform="rotate(-8 170 400)">
    <rect x="66" y="384" width="204" height="34" rx="17" fill="#D8B078"/>
    <rect x="66" y="384" width="204" height="12" rx="6" fill="#fff" opacity=".22"/>
    <rect x="22" y="396" width="52" height="12" rx="6" fill="#B98650"/><rect x="262" y="396" width="52" height="12" rx="6" fill="#B98650"/>
  </g>
  <!-- kubek -->
  <g>
    <path d="M78 300H140V346C140 366 126 374 109 374 92 374 78 366 78 346Z" fill="#FFFDF8" stroke="#E5D6BB" stroke-width="3"/>
    <path d="M140 314C160 314 160 348 138 348" fill="none" stroke="#E5D6BB" stroke-width="7" stroke-linecap="round"/>
    <path d="M84 312H134" stroke="#B0602A" stroke-width="6" stroke-linecap="round"/>
    <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".9"><path d="M96 286C86 274 106 268 96 254"/><path d="M118 288C108 276 128 270 118 256"/></g>
  </g>
  <!-- mąka -->
  <g fill="#fff" opacity=".85"><circle cx="220" cy="362" r="3"/><circle cx="238" cy="374" r="2.4"/><circle cx="256" cy="360" r="2"/><circle cx="212" cy="382" r="2"/></g>
</svg>
